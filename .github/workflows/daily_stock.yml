name: Daily Stock AI Notification

on:
  schedule:
    # 毎日 08:00 JST (前日 23:00 UTC) - 朝の寄り付き前
    - cron: '0 23 * * *'
    # 毎日 13:30 JST (当日 04:30 UTC) - 日中マーケット
    - cron: '30 4 * * *'
    # 毎日 21:00 JST (当日 12:00 UTC) - 夜・米国市場オープン前
    - cron: '0 12 * * *'
  workflow_dispatch: # 手動テスト実行用

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Daily Notification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python daily_job.py
